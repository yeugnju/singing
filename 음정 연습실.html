<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>음정 연습실 (Pitch Trainer)</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Apple SD Gothic Neo', sans-serif;
      background-color: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    h2 { margin-top: 0; color: #333; }
    .btn {
      background: #4a90e2;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin: 8px;
      transition: background 0.2s;
    }
    .btn:hover { background: #357abd; }
    .btn-play { background: #50e3c2; color: #1a5e50; }
    .btn-play:hover { background: #3dd1b0; }
    
    .target-box {
      font-size: 48px;
      font-weight: bold;
      color: #2c3e50;
      margin: 20px 0 10px;
    }
    .pitch-display {
      font-size: 20px;
      color: #666;
      height: 30px;
      margin-bottom: 20px;
    }
    
    /* 피치 게이지 */
    .gauge-container {
      width: 100%;
      height: 24px;
      background: #e0e0e0;
      border-radius: 12px;
      position: relative;
      overflow: hidden;
      margin-bottom: 15px;
    }
    .gauge-safe-zone {
      position: absolute;
      left: 20%;
      width: 60%;
      top: 0;
      bottom: 0;
      background: #e8f8f5;
      border-left: 1px dashed #2ecc71;
      border-right: 1px dashed #2ecc71;
    }
    .gauge-center {
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 3px;
      background: #777;
      transform: translateX(-50%);
      z-index: 2;
    }
    .gauge-pointer {
      position: absolute;
      top: 2px;
      bottom: 2px;
      width: 12px;
      background: #ff5e5e;
      border-radius: 6px;
      left: 50%;
      transform: translateX(-50%);
      transition: left 0.1s ease-out, background 0.2s;
      z-index: 3;
    }
    
    .status {
      font-size: 22px;
      font-weight: bold;
      min-height: 32px;
    }
    .perfect { color: #2ecc71; }
    .good { color: #f39c12; }
    .wrong { color: #e74c3c; }
  </style>
</head>
<body>

  <div class="card">
    <h2>🎯 실시간 음정 연습기</h2>
    <button id="start-btn" class="btn">🎤 마이크 켜기</button>
    
    <div style="margin-top: 15px;">
      <button id="next-btn" class="btn btn-play">🎲 문제 생성 (목표 음)</button>
      <button id="listen-btn" class="btn" style="background:#9b59b6;">🔊 목표 음 듣기</button>
    </div>

    <!-- 자연음(도~시)만 표시되는 영역 -->
    <div class="target-box" id="target-note">--</div>
    
    <div class="gauge-container">
      <div class="gauge-safe-zone"></div>
      <div class="gauge-center"></div>
      <div id="pointer" class="gauge-pointer"></div>
    </div>

    <div class="pitch-display">
      내 소리: <span id="current-note" style="font-weight:bold; color:#333;">--</span>
    </div>

    <div id="status" class="status"></div>
  </div>

  <script>
    // 전체 12음계 한글 표기
    const notes = ["도", "도#", "레", "레#", "미", "파", "파#", "솔", "솔#", "라", "라#", "시"];
    
    // 문제 생성용 기본 7음 MIDI 번호 (C4~B4 옥타브 기준 자연음만)
    const naturalMidiNotes = [60, 62, 64, 65, 67, 69, 71]; 

    let audioCtx, analyser, micStream;
    let targetFreq = 0;
    let targetNotePitchClass = -1;

    const startBtn = document.getElementById('start-btn');
    const nextBtn = document.getElementById('next-btn');
    const listenBtn = document.getElementById('listen-btn');
    const targetDisplay = document.getElementById('target-note');
    const currentDisplay = document.getElementById('current-note');
    const pointer = document.getElementById('pointer');
    const statusDisplay = document.getElementById('status');

    function generateTargetNote() {
      // 샵이 없는 자연음 7개 중 무작위 선택
      const randomIndex = Math.floor(Math.random() * naturalMidiNotes.length);
      const midiNum = naturalMidiNotes[randomIndex];
      
      targetNotePitchClass = midiNum % 12;
      targetFreq = 440 * Math.pow(2, (midiNum - 69) / 12);
      
      targetDisplay.innerText = notes[targetNotePitchClass];
      statusDisplay.innerText = "";
      statusDisplay.className = "status";
    }

    listenBtn.addEventListener('click', () => {
      if (targetNotePitchClass === -1) generateTargetNote();
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(targetFreq, ctx.currentTime);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.5);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 1.5);
    });

    nextBtn.addEventListener('click', generateTargetNote);

    startBtn.addEventListener('click', async () => {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const source = audioCtx.createMediaStreamSource(micStream);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 2048;
        source.connect(analyser);

        startBtn.innerText = "🎙️ 감지 중...";
        startBtn.style.background = "#27ae60";
        if (targetNotePitchClass === -1) generateTargetNote();
        
        updatePitch();
      } catch (err) {
        alert("마이크 접근 권한이 필요합니다.");
      }
    });

    function autoCorrelate(buf, sampleRate) {
      let SIZE = buf.length;
      let rms = 0;
      for (let i = 0; i < SIZE; i++) {
        let val = buf[i];
        rms += val * val;
      }
      rms = Math.sqrt(rms / SIZE);
      if (rms < 0.01) return -1;

      let r1 = 0, r2 = SIZE - 1, thres = 0.2;
      for (let i = 0; i < SIZE / 2; i++) {
        if (Math.abs(buf[i]) < thres) { r1 = i; break; }
      }
      for (let i = 1; i < SIZE / 2; i++) {
        if (Math.abs(buf[SIZE - i]) < thres) { r2 = SIZE - i; break; }
      }

      buf = buf.slice(r1, r2);
      SIZE = buf.length;

      let c = new Array(SIZE).fill(0);
      for (let i = 0; i < SIZE; i++) {
        for (let j = 0; j < SIZE - i; j++) {
          c[i] = c[i] + buf[j] * buf[j + i];
        }
      }

      let d = 0;
      while (c[d] > c[d + 1]) d++;
      let maxval = -1, maxpos = -1;
      for (let i = d; i < SIZE; i++) {
        if (c[i] > maxval) {
          maxval = c[i];
          maxpos = i;
        }
      }
      let T0 = maxpos;
      return sampleRate / T0;
    }

    function updatePitch() {
      const buf = new Float32Array(2048);
      analyser.getFloatTimeDomainData(buf);
      const pitch = autoCorrelate(buf, audioCtx.sampleRate);

      if (pitch !== -1) {
        const midiNum = 12 * (Math.log(pitch / 440) / Math.log(2)) + 69;
        const currentPitchClass = (Math.round(midiNum) % 12 + 12) % 12;
        
        currentDisplay.innerText = notes[currentPitchClass];

        if (targetNotePitchClass !== -1) {
          const octavesDiff = Math.round((midiNum - (targetNotePitchClass + 60)) / 12);
          const octaveAdjustedTargetFreq = targetFreq * Math.pow(2, octavesDiff);

          const cents = 1200 * Math.log2(pitch / octaveAdjustedTargetFreq);

          let position = 50 + (cents / 75) * 50;
          position = Math.max(0, Math.min(100, position));
          pointer.style.left = `${position}%`;

          const absCents = Math.abs(cents);

          if (absCents <= 35) {
            pointer.style.background = "#2ecc71";
            statusDisplay.innerText = "🎉 성공! 참 잘했어요!";
            statusDisplay.className = "status perfect";
          } else if (absCents <= 50) {
            pointer.style.background = "#f39c12";
            statusDisplay.innerText = cents < 0 ? "🤏 조금만 더 높게!" : "🤏 조금만 더 낮게!";
            statusDisplay.className = "status good";
          } else {
            pointer.style.background = "#ff5e5e";
            statusDisplay.innerText = cents < 0 ? "⬆️ 음을 올려보세요" : "⬇️ 음을 내려보세요";
            statusDisplay.className = "status wrong";
          }
        }
      } else {
        currentDisplay.innerText = "--";
      }

      requestAnimationFrame(updatePitch);
    }
  </script>
</body>
</html>
